version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payverify-backend
    restart: always
    ports:
      - "7001:7001"
    env_file:
      - .env
    environment:
      - PORT=7001
      - REDIS_URL=redis://default:checkbirr!162127@redis:6379
    depends_on:
      - redis
      - db

  redis:
    image: redis:7-alpine
    container_name: payverify-redis
    restart: always
    command: redis-server --requirepass checkbirr!162127
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  db:
    image: postgres:16-alpine
    container_name: payverify-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword
      POSTGRES_DB: payverify
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  redis_data:
  pg_data:
